name: Build models

on:
  push:
    paths:
      - drone_case.py
      - .github/workflows/build-models.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CadQuery
        run: pip install cadquery

      - name: Generate STEP and STL
        run: python drone_case.py

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: drone-case-models
          path: out/

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "Models unchanged"
          else
            git commit -m "Regenerate models [skip ci]"
            git push
          fi
