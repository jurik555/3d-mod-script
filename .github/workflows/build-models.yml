name: Build models

on:
  push:
    paths:
      - drone_frame.py
      - requirements.txt
      - .github/workflows/build-models.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CadQuery
        run: pip install -r requirements.txt

      - name: Generate STEP and STL
        run: rm -rf out && python drone_frame.py

      - name: Upload models
        uses: actions/upload-artifact@v5
        with:
          name: drone-case-models
          path: out/

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A out/
          if git diff --cached --quiet; then
            echo "Models unchanged"
          else
            git commit -m "Regenerate models [skip ci]"
            git push
          fi
